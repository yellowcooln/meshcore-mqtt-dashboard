version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /backend
    target-branch: main
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
    # Node 24 LTS is intentional. Review the next LTS migration separately.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
